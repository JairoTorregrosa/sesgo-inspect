# SESGO monitoring panel (D13, spec 06).
#
# To add a model, add one entry to `configs`. Required fields: name, model, group,
# reasoning. Everything else is optional and falls back to `defaults`.
#
#   name           unique, becomes a directory name (letters, digits, . - _)
#   model          provider-qualified Inspect model id
#   group          anchor (the paper evaluated it) | modern
#   reasoning      off | low            -- what this entry claims the model is doing
#   prompt_styles  [clean] | [clean, paper]   (default [clean])
#   model_args     passed to the provider constructor (OpenRouter: reasoning_enabled,
#                  provider, models, transforms)
#   generate       GenerateConfig overrides (reasoning_effort, ...)
#   max_tokens     task-level token budget; null = provider default
#   price_model    OpenRouter model id used for pricing (default: model without the
#                  `openrouter/` prefix)
#   note           free text, printed in REPORT.md (use it to record a model that
#                  cannot switch reasoning off)
#
# How reasoning is switched off is provider-specific and was measured, not guessed:
# `uv run sesgo-run smoke` re-runs the check (V4). Measured on 2026-09-21 with 2 samples
# per candidate, reasoning tokens from `log.stats.model_usage[...].reasoning_tokens`:
#
#   model                    default  enabled:false  effort:none  effort:minimal  effort:low
#   openai/gpt-5.4-nano            0              0            0              68         116
#   google/gemini-3.1-flash-lite   0              0            0               0         241
#   deepseek/deepseek-v4-flash   134              0            0             166         140
#   qwen/qwen3.5-9b             1432              0            0            1460        1463
#   meta-llama/llama-3.1-8b        0              0            -               -           -
#   openai/gpt-4o-mini             0              0            -               -           -
#
# `model_args: {reasoning_enabled: false}` becomes OpenRouter's documented
# `reasoning: {enabled: false}` and is the only switch that works on all four modern
# models (`reasoning_effort: "minimal"` does NOT: it *raises* reasoning on three of
# them). The two anchors have no reasoning mode at all, so they carry no switch and
# stay as close to the paper protocol as possible.

defaults:
  temperature: 0.75
  max_tokens: 512
  max_connections: 16
  timeout: 600
  attempt_timeout: 180

configs:
  # ---------------------------------------------------------------- anchors (D12)
  - name: llama-3.1-8b-instruct
    model: openrouter/meta-llama/llama-3.1-8b-instruct
    group: anchor
    reasoning: "off"
    prompt_styles: [clean, paper]
    note: "Paper anchor (Llama 3.1 Instruct). No reasoning mode; measured 0 reasoning tokens."

  - name: gpt-4o-mini
    model: openrouter/openai/gpt-4o-mini
    group: anchor
    reasoning: "off"
    prompt_styles: [clean, paper]
    note: "Paper anchor (GPT-4o mini). No reasoning mode; measured 0 reasoning tokens."

  # ---------------------------------------------------------------- modern, reasoning off
  - name: gpt-5.4-nano
    model: openrouter/openai/gpt-5.4-nano
    group: modern
    reasoning: "off"
    model_args: {reasoning_enabled: false}

  - name: gemini-3.1-flash-lite
    model: openrouter/google/gemini-3.1-flash-lite
    group: modern
    reasoning: "off"
    model_args: {reasoning_enabled: false}

  - name: deepseek-v4-flash
    model: openrouter/deepseek/deepseek-v4-flash
    group: modern
    reasoning: "off"
    model_args: {reasoning_enabled: false}

  - name: qwen3.5-9b
    model: openrouter/qwen/qwen3.5-9b
    group: modern
    reasoning: "off"
    model_args: {reasoning_enabled: false}

  # ---------------------------------------------------------------- modern, reasoning low
  - name: gpt-5.4-nano-low
    model: openrouter/openai/gpt-5.4-nano
    group: modern
    reasoning: "low"
    generate: {reasoning_effort: low}
    max_tokens: 8192

  - name: gemini-3.1-flash-lite-low
    model: openrouter/google/gemini-3.1-flash-lite
    group: modern
    reasoning: "low"
    generate: {reasoning_effort: low}
    max_tokens: 8192

  - name: deepseek-v4-flash-low
    model: openrouter/deepseek/deepseek-v4-flash
    group: modern
    reasoning: "low"
    generate: {reasoning_effort: low}
    max_tokens: 8192

  - name: qwen3.5-9b-low
    model: openrouter/qwen/qwen3.5-9b
    group: modern
    reasoning: "low"
    generate: {reasoning_effort: low}
    max_tokens: 8192

  # ---------------------------------------------------------------- added by a user (V12)
  - name: mistral-small-2603
    model: openrouter/mistralai/mistral-small-2603
    group: modern
    reasoning: "off"
    model_args: {reasoning_enabled: false}
    max_connections: 4
    note: >-
      Rate-limited: Mistral is the only provider. The 200-sample pilot needed 30 min 34 s
      at max_connections 16 because 274 of 474 calls came back HTTP 429 and were retried
      with backoff; the same 200 samples take 38 s on gpt-4.1-nano. Cost is unaffected (a
      429 is free), the clock is not: the full stage on this model is ~6 h, so it was not
      run. max_connections lowered to 4.

  - name: gpt-4.1-nano
    model: openrouter/openai/gpt-4.1-nano
    group: modern
    reasoning: "off"
    prompt_styles: [clean, paper]
    model_args: {reasoning_enabled: false}
